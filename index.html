<!DOCTYPE html>
<html lang="id">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>KONTOY</title>
  <link href="https://fonts.googleapis.com/css2?family=Sora:wght@400;600;800&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="style.css">
</head>

<body>
  <div class="app">

    <!-- ===== HEADER: judul, tombol suara, saldo ===== -->
    <header>
      <div>
        <h1>KONTOY</h1>
        <small>cacing-cacing naga-naga</small>
      </div>
      <div class="sp"></div>
      <button class="ib" id="snd" title="Suara">🔊</button>
      <div class="bal"><span>SALDO</span><b id="bal">Rp0</b></div>
    </header>

    <!-- ===== PANGGUNG: animasi langit + angka pengali ===== -->
    <div class="stage">
      <canvas id="cv"></canvas>
      <div class="ov">
        <div id="mult">1,00x</div>
        <div id="lbl"></div>
      </div>
    </div>

    <!-- ===== PANEL TARUHAN ===== -->
    <div class="card">
      <div class="row" style="margin-bottom:10px">
        <span class="lab">Taruhan</span>
        <button class="chip" data-v="10000">Rp10.000</button>
        <button class="chip" data-v="50000">Rp50.000</button>
        <button class="chip" data-v="100000">Rp100.000</button>
        <button class="chip" data-v="250000">Rp250.000</button>
      </div>

      <div class="row" style="margin-bottom:10px">
        <span class="lab">Manual</span>
        <input id="amt" type="number" inputmode="numeric" value="50000" min="1000">
        <button class="chip" id="half">½</button>
        <button class="chip" id="dbl">2×</button>
        <button class="chip" id="max">Maks</button>
      </div>

      <div class="row">
        <span class="lab">Tarik euy wd otomatis</span>
        <input id="auto" type="number" step="0.1" min="1.1" placeholder="mis. 2.0">
        <span class="lab" style="min-width:0">x (kosongkan untuk manual)</span>
      </div>

      <div class="actions">
        <button class="btn" id="main"></button>
        <button class="btn half" id="halfout">TARIK SETENG BISI RUNGKAD</button>
      </div>
      <div id="msg"></div>
    </div>

    <!-- ===== HASIL RONDE TERAKHIR ===== -->
    <div class="card">
      <h3>Hasil ronde terakhir <small>titik astronot nabrak</small></h3>
      <div class="row" id="last"></div>
    </div>

    <!-- ===== RIWAYAT TARUHAN ===== -->
    <div class="card">
      <h3>Riwayat taruhan <button class="sm" id="clr">Hapus</button></h3>
      <div id="hist"></div>
    </div>

    <!-- ===== STATISTIK ===== -->
    <div class="card">
      <div class="stats">
        <div><span>Ronde</span><b id="s1">0</b></div>
        <div><span>Total dipasang</span><b id="s2">Rp0</b></div>
        <div><span>Hasil bersih</span><b id="s3">Rp0</b></div>
        <div><span>Peluang ≥ x2</span><b>66%</b></div>
      </div>
      <div style="text-align:center;margin-top:10px">
        <button class="sm" id="rst">Reset saldo</button>
      </div>
    </div>

    <footer>
      mental wani = benghar<br>
      mental aman?
    </footer>
  </div>

  <script src="script.js"></script>
</body>

</html>
